server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=America/Mexico_City
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

# Configuración de zona horaria para América/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
server.servlet.time-zone=America/Mexico_City