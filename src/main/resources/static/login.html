<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - MRKdito POS</title>
    <style>
        :root { --primary: #19A337; --primary-dark: #158A2E; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .sucursal-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }
        .btn-cambiar {
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            display: block;
            margin: 0 auto 10px auto;
            padding: 0;
            width: auto;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button#btnLogin {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button#btnLogin:hover { background-color: var(--primary-dark); }
        #mensaje {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/logo MRKdito.png" alt="Logo MRKdito" width="300">

        <div id="txtSucursal" class="sucursal-badge">Cargando...</div>
        <button class="btn-cambiar" onclick="window.location.href='/sucursal.html'">Cambiar sucursal</button>

        <input type="text" id="alias" placeholder="Usuario / Alias" autofocus>
        <input type="password" id="pass" placeholder="Contraseña">

        <button id="btnLogin" onclick="doLogin()">Entrar al Sistema</button>

        <p id="mensaje"></p>
    </div>

    <script>
        async function doLogin() {
            const aliasInput = document.getElementById('alias');
            const passInput = document.getElementById('pass');
            const btnLogin = document.getElementById('btnLogin');
            const mensaje = document.getElementById('mensaje');

            const alias = aliasInput.value.trim();
            const pass = passInput.value.trim();

            if (!alias || !pass) {
                mensaje.textContent = "Por favor, llene todos los campos.";
                mensaje.style.color = "#dc3545";
                return;
            }

            const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
            if (!idSucursal) {
                window.location.href = '/sucursal.html';
                return;
            }

            btnLogin.disabled = true;
            mensaje.textContent = "Validando credenciales...";
            mensaje.style.color = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || "#19A337";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alias: alias, pass: pass, idSucursal: idSucursal })
                });

                if (!response.ok) throw new Error("Error en el servidor");

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('nombreUsuario', result.nombre);
                    localStorage.setItem('rolUsuario', result.rol);

                    mensaje.textContent = `¡Hola ${result.nombre}! Accediendo...`;
                    mensaje.style.color = "#28a745";

                    setTimeout(() => {
                        window.location.href = '/menu.html';
                    }, 800);
                } else {
                    mensaje.textContent = result.message;
                    mensaje.style.color = "#dc3545";
                    passInput.value = "";
                    btnLogin.disabled = false;
                }
            } catch (error) {
                mensaje.textContent = "No se pudo conectar con el servidor.";
                mensaje.style.color = "#dc3545";
                btnLogin.disabled = false;
                console.error("Error en login:", error);
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') doLogin();
        });

        window.onload = () => {
            const idSucursal = localStorage.getItem('idSucursal');
            const nombreSucursal = localStorage.getItem('nombreSucursal');
            const colorSucursal = localStorage.getItem('colorSucursal');

            // Limpiar datos de sesión, conservar sucursal
            const userId = localStorage.getItem('userId');
            localStorage.clear();

            if (!idSucursal) {
                window.location.href = '/sucursal.html';
                return;
            }

            // Restaurar datos de sucursal
            localStorage.setItem('idSucursal', idSucursal);
            localStorage.setItem('nombreSucursal', nombreSucursal || '');
            localStorage.setItem('colorSucursal', colorSucursal || '#19A337');

            // Aplicar color de sucursal
            const color = colorSucursal || '#19A337';
            document.documentElement.style.setProperty('--primary', color);
            const darkColor = shadeColor(color, -15);
            document.documentElement.style.setProperty('--primary-dark', darkColor);

            // Mostrar nombre de sucursal
            document.getElementById('txtSucursal').textContent = '🏪 ' + (nombreSucursal || 'Sucursal');
            document.getElementById('txtSucursal').style.background = color;
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3), 16);
            let G = parseInt(color.substring(3,5), 16);
            let B = parseInt(color.substring(5,7), 16);
            R = parseInt(R * (100 + percent) / 100);
            G = parseInt(G * (100 + percent) / 100);
            B = parseInt(B * (100 + percent) / 100);
            R = Math.min(255, Math.max(0, R));
            G = Math.min(255, Math.max(0, G));
            B = Math.min(255, Math.max(0, B));
            return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
        }
    </script>
</body>
</html>
