<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - MRKdito POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #19A337; --primary-dark: #158A2E; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            background: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, color-mix(in srgb, var(--primary) 12%, transparent) 0%, transparent 70%);
            top: -80px;
            right: -80px;
            pointer-events: none;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand img {
            width: 200px;
            filter: brightness(0) invert(1) drop-shadow(0 2px 8px rgba(255,255,255,0.1));
        }

        .branch-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 30px;
            margin-top: 14px;
        }

        .login-card {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 32px;
            backdrop-filter: blur(16px);
        }

        .card-heading {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }

        .card-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 24px;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .field-group {
            margin-bottom: 16px;
        }

        .field-input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field-input::placeholder { color: rgba(255,255,255,0.25); }

        .field-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25,163,55,0.18);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            margin-top: 6px;
        }

        .btn-login:hover:not(:disabled) { filter: brightness(0.9); }
        .btn-login:active:not(:disabled) { transform: scale(0.99); }
        .btn-login:disabled { opacity: 0.55; cursor: not-allowed; }

        #mensaje {
            text-align: center;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .change-branch {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-decoration: underline;
            transition: color 0.15s;
        }

        .change-branch:hover { color: rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <img src="/logo MRKdito.png" alt="MRKdito POS">
            <div>
                <span id="txtSucursal" class="branch-chip">🏪 Cargando...</span>
            </div>
        </div>

        <div class="login-card">
            <p class="card-heading">Bienvenido</p>
            <p class="card-sub">Ingresa tus credenciales para acceder</p>

            <div class="field-group">
                <label class="field-label" for="alias">Usuario / Alias</label>
                <input class="field-input" type="text" id="alias" placeholder="Tu usuario..." autofocus>
            </div>

            <div class="field-group">
                <label class="field-label" for="pass">Contraseña</label>
                <input class="field-input" type="password" id="pass" placeholder="••••••••">
            </div>

            <button id="btnLogin" class="btn-login" onclick="doLogin()">Entrar al Sistema</button>

            <p id="mensaje"></p>
        </div>

        <button class="change-branch" onclick="window.location.href='/sucursal.html'">Cambiar sucursal</button>
    </div>

    <script>
        async function doLogin() {
            const aliasInput = document.getElementById('alias');
            const passInput = document.getElementById('pass');
            const btnLogin = document.getElementById('btnLogin');
            const mensaje = document.getElementById('mensaje');

            const alias = aliasInput.value.trim();
            const pass = passInput.value.trim();

            if (!alias || !pass) {
                mensaje.textContent = "Por favor, llene todos los campos.";
                mensaje.style.color = "#f87171";
                return;
            }

            const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
            if (!idSucursal) {
                window.location.href = '/sucursal.html';
                return;
            }

            btnLogin.disabled = true;
            mensaje.textContent = "Validando credenciales...";
            mensaje.style.color = "rgba(255,255,255,0.5)";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alias: alias, pass: pass, idSucursal: idSucursal })
                });

                if (!response.ok) throw new Error("Error en el servidor");
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('nombreUsuario', result.nombre);
                    localStorage.setItem('rolUsuario', result.rol);

                    mensaje.textContent = `¡Hola ${result.nombre}! Accediendo...`;
                    mensaje.style.color = "#4ade80";

                    setTimeout(() => { window.location.href = '/menu.html'; }, 800);
                } else {
                    mensaje.textContent = result.message;
                    mensaje.style.color = "#f87171";
                    passInput.value = "";
                    btnLogin.disabled = false;
                }
            } catch (error) {
                mensaje.textContent = "No se pudo conectar con el servidor.";
                mensaje.style.color = "#f87171";
                btnLogin.disabled = false;
            }
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

        window.onload = () => {
            const idSucursal    = localStorage.getItem('idSucursal');
            const nombreSucursal = localStorage.getItem('nombreSucursal');
            const colorSucursal  = localStorage.getItem('colorSucursal');

            const userId = localStorage.getItem('userId');
            localStorage.clear();

            if (!idSucursal) { window.location.href = '/sucursal.html'; return; }

            localStorage.setItem('idSucursal', idSucursal);
            localStorage.setItem('nombreSucursal', nombreSucursal || '');
            localStorage.setItem('colorSucursal', colorSucursal || '#19A337');

            const color = colorSucursal || '#19A337';
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--primary-dark', shadeColor(color, -15));

            const badge = document.getElementById('txtSucursal');
            badge.textContent = '🏪 ' + (nombreSucursal || 'Sucursal');
            badge.style.background = color;
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3), 16);
            let G = parseInt(color.substring(3,5), 16);
            let B = parseInt(color.substring(5,7), 16);
            R = Math.min(255, Math.max(0, parseInt(R * (100 + percent) / 100)));
            G = Math.min(255, Math.max(0, parseInt(G * (100 + percent) / 100)));
            B = Math.min(255, Math.max(0, parseInt(B * (100 + percent) / 100)));
            return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
        }
    </script>
</body>
</html>
