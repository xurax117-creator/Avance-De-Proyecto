<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - MRKdito POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --primary: #19A337; --primary-dark: #158A2E; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== PANEL IZQUIERDO ===== */
        .panel-brand {
            width: 45%;
            min-height: 100vh;
            background: #080c10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 40px;
            position: relative;
            overflow: hidden;
        }

        .panel-brand::before {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25,163,55,0.18) 0%, transparent 65%);
            bottom: -100px;
            right: -100px;
            pointer-events: none;
        }

        .panel-brand::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25,163,55,0.10) 0%, transparent 65%);
            top: -60px;
            left: -60px;
            pointer-events: none;
        }

        .brand-logo-card {
            background: white;
            border-radius: 20px;
            padding: 18px 28px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 48px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
        }

        .brand-logo-card img {
            width: 200px;
            display: block;
        }

        .brand-tagline {
            margin-top: 28px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            position: relative;
            z-index: 1;
        }

        .brand-divider {
            width: 32px;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            margin: 16px auto 0;
            position: relative;
            z-index: 1;
        }

        /* ===== PANEL DERECHO ===== */
        .panel-form {
            width: 55%;
            min-height: 100vh;
            background: #0f1419;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 60px;
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        .form-inner {
            width: 100%;
            max-width: 360px;
        }

        .branch-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 30px;
            margin-bottom: 28px;
            background: rgba(25,163,55,0.12);
            color: var(--primary);
            border: 1px solid rgba(25,163,55,0.2);
        }

        .card-heading {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card-sub {
            font-size: 13.5px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 32px;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .field-group { margin-bottom: 18px; }

        .field-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.09);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .field-input::placeholder { color: rgba(255,255,255,0.22); }

        .field-input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 0 3px rgba(25,163,55,0.15);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            margin-top: 6px;
            box-shadow: 0 4px 20px rgba(25,163,55,0.35);
        }

        .btn-login:hover:not(:disabled) { filter: brightness(0.9); }
        .btn-login:active:not(:disabled) { transform: scale(0.99); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

        #mensaje {
            text-align: center;
            font-size: 13px;
            margin-top: 14px;
            min-height: 20px;
            font-weight: 500;
        }

        .change-branch {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.22);
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-decoration: underline;
            transition: color 0.15s;
        }

        .change-branch:hover { color: rgba(255,255,255,0.5); }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .panel-brand { width: 100%; min-height: auto; padding: 40px 24px; }
            .panel-form  { width: 100%; min-height: auto; padding: 40px 24px; border-left: none; border-top: 1px solid rgba(255,255,255,0.05); }
        }
    </style>
</head>
<body>

    <div class="panel-brand">
        <div class="brand-logo-card">
            <img src="/mrkdito logo sin fondo real.png" alt="MRKdito POS">
        </div>
        <p class="brand-tagline">Sistema Punto de Venta</p>
        <div class="brand-divider"></div>
    </div>

    <div class="panel-form">
        <div class="form-inner">
            <span id="txtSucursal" class="branch-chip">🏪 Cargando...</span>

            <h1 class="card-heading">Bienvenido</h1>
            <p class="card-sub">Ingresa tus credenciales para acceder</p>

            <div class="field-group">
                <label class="field-label" for="alias">Usuario / Alias</label>
                <input class="field-input" type="text" id="alias" placeholder="Tu usuario..." autofocus>
            </div>

            <div class="field-group">
                <label class="field-label" for="pass">Contraseña</label>
                <input class="field-input" type="password" id="pass" placeholder="••••••••">
            </div>

            <button id="btnLogin" class="btn-login" onclick="doLogin()">Entrar al Sistema</button>

            <p id="mensaje"></p>

            <button class="change-branch" onclick="window.location.href='/sucursal.html'">Cambiar sucursal</button>
        </div>
    </div>

    <script>
        async function doLogin() {
            const aliasInput = document.getElementById('alias');
            const passInput  = document.getElementById('pass');
            const btnLogin   = document.getElementById('btnLogin');
            const mensaje    = document.getElementById('mensaje');

            const alias = aliasInput.value.trim();
            const pass  = passInput.value.trim();

            if (!alias || !pass) {
                mensaje.textContent = "Por favor, llene todos los campos.";
                mensaje.style.color = "#f87171";
                return;
            }

            const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
            if (!idSucursal) { window.location.href = '/sucursal.html'; return; }

            btnLogin.disabled = true;
            mensaje.textContent = "Validando credenciales...";
            mensaje.style.color = "rgba(255,255,255,0.4)";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alias, pass, idSucursal })
                });

                if (!response.ok) throw new Error();
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userId', result.userId);
                    localStorage.setItem('nombreUsuario', result.nombre);
                    localStorage.setItem('rolUsuario', result.rol);

                    mensaje.textContent = `¡Hola ${result.nombre}! Accediendo...`;
                    mensaje.style.color = "#4ade80";

                    setTimeout(() => { window.location.href = '/menu.html'; }, 800);
                } else {
                    mensaje.textContent = result.message;
                    mensaje.style.color = "#f87171";
                    passInput.value = "";
                    btnLogin.disabled = false;
                }
            } catch {
                mensaje.textContent = "No se pudo conectar con el servidor.";
                mensaje.style.color = "#f87171";
                btnLogin.disabled = false;
            }
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

        window.onload = () => {
            const idSucursal     = localStorage.getItem('idSucursal');
            const nombreSucursal = localStorage.getItem('nombreSucursal');
            const colorSucursal  = localStorage.getItem('colorSucursal');

            localStorage.clear();

            if (!idSucursal) { window.location.href = '/sucursal.html'; return; }

            localStorage.setItem('idSucursal', idSucursal);
            localStorage.setItem('nombreSucursal', nombreSucursal || '');
            localStorage.setItem('colorSucursal', colorSucursal || '#19A337');

            const color = colorSucursal || '#19A337';
            document.documentElement.style.setProperty('--primary', color);
            document.documentElement.style.setProperty('--primary-dark', shadeColor(color, -15));

            const r = parseInt(color.substring(1,3), 16);
            const g = parseInt(color.substring(3,5), 16);
            const b = parseInt(color.substring(5,7), 16);
            document.querySelector('.panel-brand').style.setProperty('--halo-color', `rgba(${r},${g},${b},0.18)`);

            const badge = document.getElementById('txtSucursal');
            badge.textContent = '🏪 ' + (nombreSucursal || 'Sucursal');
            badge.style.background = color + '1a';
            badge.style.color = color;
            badge.style.borderColor = color + '33';
        };

        function shadeColor(color, percent) {
            let R = parseInt(color.substring(1,3), 16);
            let G = parseInt(color.substring(3,5), 16);
            let B = parseInt(color.substring(5,7), 16);
            R = Math.min(255, Math.max(0, parseInt(R * (100 + percent) / 100)));
            G = Math.min(255, Math.max(0, parseInt(G * (100 + percent) / 100)));
            B = Math.min(255, Math.max(0, parseInt(B * (100 + percent) / 100)));
            return '#' + R.toString(16).padStart(2,'0') + G.toString(16).padStart(2,'0') + B.toString(16).padStart(2,'0');
        }
    </script>
</body>
</html>
