<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Promociones - MRKdito</title>
    <link rel="stylesheet" href="/estilos.css">
    <style>
        .promocion-inactiva { opacity: 0.5; }
        .promocion-inactiva td { text-decoration: line-through; color: #9ca3af; }

        .tipo-badge {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .tipo-buy_x_get_y     { background: #dbeafe; color: #1d4ed8; }
        .tipo-percent_off     { background: #fff7ed; color: #c2410c; }
        .tipo-fixed_discount  { background: #ecfdf5; color: #047857; }

        .btn-editar, .btn-eliminar {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: filter 0.15s;
            margin-right: 3px;
        }

        .btn-editar  { background: #fef3c7; color: #92400e; }
        .btn-eliminar { background: #fee2e2; color: #b91c1c; }
        .btn-editar:hover, .btn-eliminar:hover { filter: brightness(0.9); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,30,0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 32px 16px;
        }

        .modal-content {
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 28px;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-content h3 {
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .full { grid-column: span 2; }

        .help-text { font-size: 11px; color: #9ca3af; margin-top: 4px; }

        .modal-footer {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .product-search-wrap {
            display: flex;
            gap: 8px;
        }

        #productos_seleccionados {
            min-height: 38px;
            margin-top: 10px;
            padding: 8px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
        }

        .prod-tag {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .prod-tag-remove {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 15px;
            padding: 0;
            line-height: 1;
            opacity: 0.8;
        }

        .prod-tag-remove:hover { opacity: 1; }

        #resultados_busqueda {
            margin-top: 8px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            display: none;
        }

        #lista_resultados > div {
            padding: 9px 12px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        #lista_resultados > div:last-child { border-bottom: none; }
        #lista_resultados > div:hover { background: #f9fafb; }

        .modal-form .form-group { margin-bottom: 0; }
        .modal-form .form-group label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
        .modal-form .form-group input,
        .modal-form .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .modal-form .form-group input:focus,
        .modal-form .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25,163,55,0.10);
        }

        .promo-active-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            padding: 8px 0;
        }

        .promo-active-label input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div id="layout" class="app-layout">
    <!-- sidebar injected by sidebar.js -->
    <div class="page-content">
        <header class="content-header">
            <h1 class="page-title"><span>🏷️</span> Promociones</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="abrirModal()">+ Nueva Promoción</button>
            </div>
        </header>
        <div class="content-scroll">

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Productos</th>
                                <th>Cant. Req.</th>
                                <th>Precio / Descuento</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaPromociones"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Promoción -->
<div id="modalPromocion" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Promoción</h3>
        <input type="hidden" id="promo_id">

        <div class="form-grid modal-form">

            <div class="full form-group">
                <label>Nombre de la Promoción</label>
                <input type="text" id="promo_nombre" placeholder="Ej. 2x1 en cervezas">
            </div>

            <div class="form-group">
                <label>Tipo de Promoción</label>
                <select id="promo_tipo" onchange="cambiarCampos()">
                    <option value="buy_x_get_y">Compra X paga Y</option>
                    <option value="percent_off">Descuento porcentual</option>
                    <option value="fixed_discount">Descuento fijo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Cantidad Requerida</label>
                <input type="number" step="0.01" id="promo_cantidad" min="1">
            </div>

            <div class="full form-group">
                <label>Productos Participantes</label>
                <div class="product-search-wrap">
                    <input type="text" id="buscador_productos" placeholder="Escribe para buscar y presiona Enter..." style="flex:1">
                    <button class="btn btn-secondary" onclick="buscarProductos()">Buscar</button>
                </div>
                <div id="productos_seleccionados">
                    <span style="color:#9ca3af;font-size:12px">Ningún producto seleccionado</span>
                </div>
                <div id="resultados_busqueda">
                    <div id="lista_resultados"></div>
                </div>
                <p class="help-text">Presione Enter o el botón Buscar. Los productos seleccionados aparecen arriba.</p>
            </div>

            <div id="campo_precio_especial" class="form-group">
                <label>Precio Especial ($)</label>
                <input type="number" step="0.01" id="promo_precio_especial">
            </div>

            <div id="campo_descuento_porcentaje" class="form-group" style="display:none">
                <label>Descuento Porcentual (%)</label>
                <input type="number" step="0.01" id="promo_descuento_porcentaje" min="0" max="100">
            </div>

            <div id="campo_descuento_fijo" class="form-group" style="display:none">
                <label>Descuento Fijo ($)</label>
                <input type="number" step="0.01" id="promo_descuento_fijo">
            </div>

            <div class="form-group">
                <label>Fecha Inicio (opcional)</label>
                <input type="date" id="promo_fecha_inicio">
            </div>

            <div class="form-group">
                <label>Fecha Fin (opcional)</label>
                <input type="date" id="promo_fecha_fin">
            </div>

            <div class="full">
                <label class="promo-active-label">
                    <input type="checkbox" id="promo_activo" checked>
                    Promoción Activa
                </label>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardarPromocion()">Guardar Promoción</button>
        </div>
    </div>
</div>

<script src="/sidebar.js"></script>
<script>
const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
if (!idSucursal || !localStorage.getItem('userId')) {
    window.location.href = '/sucursal.html';
}
document.documentElement.style.setProperty('--primary', localStorage.getItem('colorSucursal') || '#19A337');

let productos = [];
let promociones = [];
let productosSeleccionados = [];

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
    toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function cargarProductos() {
    fetch(`/api/inventario/todos?sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`)
        .then(r => r.json())
        .then(data => { productos = data; })
        .catch(err => console.error('Error cargando productos:', err));
}

function buscarProductos() {
    const query = document.getElementById('buscador_productos').value.trim();
    const resultadosDiv = document.getElementById('resultados_busqueda');
    const listaDiv = document.getElementById('lista_resultados');

    if (!query) {
        resultadosDiv.style.display = 'none';
        return;
    }

    fetch(`/api/inventario/buscar?q=${encodeURIComponent(query)}&sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`)
        .then(r => r.json())
        .then(data => {
            listaDiv.innerHTML = '';
            if (data.length === 0) {
                listaDiv.innerHTML = '<div style="color:#9ca3af;font-size:13px;padding:12px">No se encontraron productos</div>';
            } else {
                data.forEach(p => {
                    const yaSeleccionado = productosSeleccionados.some(ps => ps.id === p.id_producto);
                    const div = document.createElement('div');
                    div.style.cursor = yaSeleccionado ? 'default' : 'pointer';
                    div.style.opacity = yaSeleccionado ? '0.5' : '1';
                    const nombreEscapado = p.nombre.replace(/'/g, "\\'");
                    div.innerHTML = `
                        <span>${p.nombre} — <span style="color:#9ca3af">$${p.precio_venta}</span></span>
                        ${yaSeleccionado
                            ? '<span style="color:#15803d;font-size:12px;font-weight:600">✓ Seleccionado</span>'
                            : `<button class="btn btn-primary btn-sm" onclick="seleccionarProducto(${p.id_producto}, '${nombreEscapado}')">+ Agregar</button>`
                        }
                    `;
                    listaDiv.appendChild(div);
                });
            }
            resultadosDiv.style.display = 'block';
        })
        .catch(err => console.error('Error buscando productos:', err));
}

function seleccionarProducto(id, nombre) {
    const existe = productosSeleccionados.some(p => p.id === id);
    if (!existe) {
        productosSeleccionados.push({ id, nombre });
        actualizarProductosSeleccionados();
        document.getElementById('buscador_productos').value = '';
        document.getElementById('resultados_busqueda').style.display = 'none';
    }
}

function eliminarProductoSeleccionado(id) {
    productosSeleccionados = productosSeleccionados.filter(p => p.id !== id);
    actualizarProductosSeleccionados();
}

function actualizarProductosSeleccionados() {
    const container = document.getElementById('productos_seleccionados');
    container.innerHTML = '';
    if (productosSeleccionados.length === 0) {
        container.innerHTML = '<span style="color:#9ca3af;font-size:12px">Ningún producto seleccionado</span>';
    } else {
        productosSeleccionados.forEach(p => {
            const tag = document.createElement('div');
            tag.className = 'prod-tag';
            tag.innerHTML = `
                <span>${p.nombre}</span>
                <button class="prod-tag-remove" onclick="eliminarProductoSeleccionado(${p.id})">×</button>
            `;
            container.appendChild(tag);
        });
    }
}

function cargarPromociones() {
    fetch(`/api/promociones/todas?sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`)
        .then(r => r.json())
        .then(data => {
            promociones = data;
            mostrarPromociones();
        })
        .catch(err => console.error('Error cargando promociones:', err));
}

function mostrarPromociones() {
    const tbody = document.getElementById('listaPromociones');
    tbody.innerHTML = '';

    if (promociones.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:32px;color:#9ca3af">No hay promociones registradas</td></tr>';
        return;
    }

    promociones.forEach(p => {
        const tr = document.createElement('tr');
        if (!p.activo) tr.className = 'promocion-inactiva';

        let descuentoTexto = '';
        if (p.tipo === 'buy_x_get_y')        descuentoTexto = `$${p.precio_especial || 0} × ${p.cantidad_requerida}`;
        else if (p.tipo === 'percent_off')    descuentoTexto = `${p.descuento_porcentaje || 0}%`;
        else if (p.tipo === 'fixed_discount') descuentoTexto = `$${p.descuento_fijo || 0}`;

        const tipoLabel = { buy_x_get_y: 'X→Y', percent_off: '% Desc.', fixed_discount: '$ Fijo' };

        tr.innerHTML = `
            <td style="color:#9ca3af;font-size:12px">${p.id_promocion}</td>
            <td style="font-weight:600">${p.nombre}</td>
            <td><span class="tipo-badge tipo-${p.tipo}">${tipoLabel[p.tipo] || p.tipo}</span></td>
            <td style="font-size:12px;color:#6b7280;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.productos_texto || '—'}</td>
            <td style="text-align:center">${p.cantidad_requerida}</td>
            <td style="font-weight:600">${descuentoTexto}</td>
            <td style="font-size:12px;color:#6b7280">${p.fecha_inicio || 'Indefinido'}</td>
            <td style="font-size:12px;color:#6b7280">${p.fecha_fin || 'Indefinido'}</td>
            <td>${p.activo ? '<span class="badge badge-success">Activa</span>' : '<span class="badge badge-danger">Inactiva</span>'}</td>
            <td>
                <button class="btn-editar" onclick="editarPromocion(${p.id_promocion})">✏️ Editar</button>
                <button class="btn-eliminar" onclick="eliminarPromocion(${p.id_promocion})">🗑️</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function abrirModal(id = null) {
    document.getElementById('modalPromocion').style.display = 'block';
    productosSeleccionados = [];

    if (id) {
        const promo = promociones.find(p => p.id_promocion == id);
        if (promo) {
            document.getElementById('modalTitulo').textContent = 'Editar Promoción';
            document.getElementById('promo_id').value = promo.id_promocion;
            document.getElementById('promo_nombre').value = promo.nombre;
            document.getElementById('promo_tipo').value = promo.tipo;
            document.getElementById('promo_cantidad').value = promo.cantidad_requerida;
            document.getElementById('promo_precio_especial').value = promo.precio_especial || '';
            document.getElementById('promo_descuento_porcentaje').value = promo.descuento_porcentaje || '';
            document.getElementById('promo_descuento_fijo').value = promo.descuento_fijo || '';
            document.getElementById('promo_fecha_inicio').value = promo.fecha_inicio || '';
            document.getElementById('promo_fecha_fin').value = promo.fecha_fin || '';
            document.getElementById('promo_activo').checked = promo.activo;
            cambiarCampos();

            fetch('/api/promociones/' + id)
                .then(r => r.json())
                .then(promoDetalle => {
                    if (promoDetalle.productos_detalle && Array.isArray(promoDetalle.productos_detalle)) {
                        promoDetalle.productos_detalle.forEach(prod => {
                            productosSeleccionados.push({ id: prod.id, nombre: prod.nombre });
                        });
                        actualizarProductosSeleccionados();
                    }
                })
                .catch(err => console.error('Error cargando detalle:', err));
        }
    } else {
        document.getElementById('modalTitulo').textContent = 'Nueva Promoción';
        document.getElementById('promo_id').value = '';
        document.getElementById('promo_nombre').value = '';
        document.getElementById('promo_tipo').value = 'buy_x_get_y';
        document.getElementById('promo_cantidad').value = '';
        document.getElementById('promo_precio_especial').value = '';
        document.getElementById('promo_descuento_porcentaje').value = '';
        document.getElementById('promo_descuento_fijo').value = '';
        document.getElementById('promo_fecha_inicio').value = '';
        document.getElementById('promo_fecha_fin').value = '';
        document.getElementById('promo_activo').checked = true;
        document.getElementById('buscador_productos').value = '';
        document.getElementById('resultados_busqueda').style.display = 'none';
        actualizarProductosSeleccionados();
        cambiarCampos();
    }
}

function cerrarModal() {
    document.getElementById('modalPromocion').style.display = 'none';
}

function cambiarCampos() {
    const tipo = document.getElementById('promo_tipo').value;
    document.getElementById('campo_precio_especial').style.display      = tipo === 'buy_x_get_y'    ? 'block' : 'none';
    document.getElementById('campo_descuento_porcentaje').style.display = tipo === 'percent_off'    ? 'block' : 'none';
    document.getElementById('campo_descuento_fijo').style.display       = tipo === 'fixed_discount' ? 'block' : 'none';
}

function guardarPromocion() {
    const id = document.getElementById('promo_id').value;

    const data = {
        nombre: document.getElementById('promo_nombre').value,
        tipo: document.getElementById('promo_tipo').value,
        productos: productosSeleccionados.map(p => p.id),
        cantidad_requerida: parseFloat(document.getElementById('promo_cantidad').value),
        precio_especial: document.getElementById('promo_precio_especial').value ? parseFloat(document.getElementById('promo_precio_especial').value) : null,
        descuento_porcentaje: document.getElementById('promo_descuento_porcentaje').value ? parseFloat(document.getElementById('promo_descuento_porcentaje').value) : null,
        descuento_fijo: document.getElementById('promo_descuento_fijo').value ? parseFloat(document.getElementById('promo_descuento_fijo').value) : null,
        fecha_inicio: document.getElementById('promo_fecha_inicio').value || null,
        fecha_fin: document.getElementById('promo_fecha_fin').value || null,
        activo: document.getElementById('promo_activo').checked,
        sucursal: parseInt(localStorage.getItem('idSucursal') || '1')
    };

    if (!data.nombre || !data.productos || data.productos.length === 0 || !data.cantidad_requerida) {
        showToast('Complete todos los campos obligatorios y seleccione al menos un producto', 'warning');
        return;
    }

    if (id) data.id_promocion = id;

    fetch('/api/promociones/guardar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(result => {
        if (result.success) {
            showToast(result.message, 'success');
            cerrarModal();
            cargarPromociones();
        } else {
            showToast(result.message || 'Error al guardar', 'error');
        }
    })
    .catch(err => {
        console.error('Error:', err);
        showToast('Error al guardar promoción', 'error');
    });
}

function editarPromocion(id) {
    abrirModal(id);
}

function eliminarPromocion(id) {
    if (confirm('¿Está seguro de eliminar esta promoción?')) {
        fetch(`/api/promociones/eliminar/${id}`, { method: 'DELETE' })
        .then(r => r.json())
        .then(result => {
            if (result.success) {
                showToast(result.message, 'success');
                cargarPromociones();
            } else {
                showToast('Error al eliminar', 'error');
            }
        })
        .catch(err => {
            console.error('Error:', err);
            showToast('Error al eliminar promoción', 'error');
        });
    }
}

window.onclick = function(event) {
    const modal = document.getElementById('modalPromocion');
    if (event.target == modal) cerrarModal();
};

document.addEventListener('DOMContentLoaded', function() {
    cargarProductos();
    cargarPromociones();
});

document.addEventListener('keydown', function(e) {
    if (e.target.id === 'buscador_productos' && e.key === 'Enter') {
        buscarProductos();
    }
});
</script>

</body>
</html>
