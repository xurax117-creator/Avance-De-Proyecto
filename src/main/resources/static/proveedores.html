<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Proveedores - MRKdito</title>
    <link rel="stylesheet" href="/estilos.css">
    <style>
        .proveedor-desactivado { opacity: 0.55; }
        .proveedor-desactivado td { text-decoration: line-through; color: #9ca3af; }

        .btn-desactivar, .btn-activar, .btn-eliminar {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: filter 0.15s;
            margin-right: 3px;
        }

        .btn-desactivar { background: rgba(217,119,6,0.15);  color: #fbbf24; }
        .btn-activar    { background: rgba(22,163,74,0.15);  color: #4ade80; }
        .btn-eliminar   { background: rgba(220,38,38,0.15);  color: #f87171; }
        .btn-desactivar:hover, .btn-activar:hover, .btn-eliminar:hover { filter: brightness(1.1); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,30,0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 32px 16px;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 28px;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-content h3 {
            font-size: 16px;
            font-weight: 700;
            color: #e6edf3;
            margin: 0 0 20px;
        }

        .modal-form .form-group { margin-bottom: 14px; }
        .modal-form .form-group label { display: block; font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; }
        .modal-form .form-group input { width: 100%; padding: 9px 12px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.09); color: #e6edf3; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s; }
        .modal-form .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25,163,55,0.10); }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Light mode overrides */
        [data-theme="light"] .btn-desactivar { background: rgba(217,119,6,0.12);  color: #b45309; }
        [data-theme="light"] .btn-activar    { background: rgba(22,163,74,0.12);  color: #15803d; }
        [data-theme="light"] .btn-eliminar   { background: rgba(220,38,38,0.12);  color: #dc2626; }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div id="layout" class="app-layout">
    <!-- sidebar injected by sidebar.js -->
    <div class="page-content">
        <header class="content-header">
            <h1 class="page-title"><span>🚚</span> Proveedores</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="abrirModal()">+ Nuevo Proveedor</button>
            </div>
        </header>
        <div class="content-scroll">

            <!-- Filters -->
            <div class="filters-bar">
                <div class="form-group">
                    <label class="form-label">Buscar Proveedor</label>
                    <input type="text" class="form-control" id="txtBusqueda" onkeypress="if(event.key==='Enter') cargarProveedores()" placeholder="Buscar por nombre...">
                </div>
                <div class="form-group" style="min-width:auto">
                    <label class="form-label">&nbsp;</label>
                    <label style="display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;font-weight:500;color:#8b949e;white-space:nowrap">
                        <input type="checkbox" id="chkMostrarDesactivados" onchange="cargarProveedores()" style="width:auto">
                        Mostrar desactivados
                    </label>
                </div>
                <div class="form-group" style="min-width:auto">
                    <label class="form-label">&nbsp;</label>
                    <button class="btn btn-secondary" onclick="cargarProveedores()">🔍 Buscar</button>
                </div>
            </div>

            <!-- Table card -->
            <div class="card">
                <div class="card-header">
                    <span id="infoPagina" class="text-muted text-sm">Total de proveedores: 0</span>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listaProveedores"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Proveedor -->
<div id="modalProveedor" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Proveedor</h3>
        <input type="hidden" id="p_id">
        <div class="modal-form">
            <div class="form-group">
                <label>Nombre del Proveedor</label>
                <input type="text" id="p_nombre" placeholder="Nombre del proveedor...">
            </div>
            <div class="form-group">
                <label>Persona de Contacto</label>
                <input type="text" id="p_contacto" placeholder="Nombre del contacto...">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="p_telefono" placeholder="Teléfono...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="guardar()">Guardar Proveedor</button>
        </div>
    </div>
</div>

<script src="/sidebar.js"></script>
<script>
    const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
    if (!idSucursal || !localStorage.getItem('userId')) {
        window.location.href = '/sucursal.html';
    }
    document.documentElement.style.setProperty('--primary', localStorage.getItem('colorSucursal') || '#19A337');

    let todosLosProveedores = [];

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
        toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    async function cargarProveedores() {
        try {
            const mostrarDesactivados = document.getElementById('chkMostrarDesactivados').checked;
            const filtro = document.getElementById('txtBusqueda').value;

            const resp = await fetch(`/api/inventario/todos-proveedores?sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`);
            let data = await resp.json();

            if (filtro) {
                data = data.filter(p => p.nombre.toLowerCase().includes(filtro.toLowerCase()));
            }

            if (!mostrarDesactivados) {
                data = data.filter(p => p.activo);
            }

            data.sort((a, b) => a.nombre.localeCompare(b.nombre));
            data.forEach((p, index) => { p.numero = index + 1; });

            todosLosProveedores = data;
            dibujarTabla();
        } catch (e) { console.error("Error cargando proveedores", e); }
    }

    function dibujarTabla() {
        const tbody = document.getElementById('listaProveedores');
        tbody.innerHTML = "";

        document.getElementById('infoPagina').textContent = `Total de proveedores: ${todosLosProveedores.length}`;

        todosLosProveedores.forEach(p => {
            const tr = document.createElement('tr');
            if (!p.activo) tr.className = "proveedor-desactivado";

            tr.ondblclick = () => abrirModal(p);

            const estado = p.activo ?
                '<span class="badge badge-success">Activo</span>' :
                '<span class="badge badge-danger">Inactivo</span>';

            const btnAccion = p.activo ?
                `<button class="btn-desactivar" onclick="desactivarProveedor(${p.id})" title="Desactivar">⛔ Desactivar</button>
                 <button class="btn-eliminar" onclick="eliminarProveedor(${p.id})" title="Eliminar">🗑️</button>` :
                `<button class="btn-activar" onclick="activarProveedor(${p.id})" title="Activar">✅ Activar</button>
                 <button class="btn-eliminar" onclick="eliminarProveedor(${p.id})" title="Eliminar">🗑️</button>`;

            tr.innerHTML = `
                <td style="color:#9ca3af;font-size:12px">${p.numero}</td>
                <td style="font-weight:600">${p.nombre}</td>
                <td>${p.contacto || '—'}</td>
                <td>${p.telefono || '—'}</td>
                <td>${estado}</td>
                <td>${btnAccion}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function abrirModal(p = null) {
        document.getElementById('modalTitulo').textContent = p ? "Editar Proveedor" : "Nuevo Proveedor";
        document.getElementById('p_id').value = p ? p.id : "";
        document.getElementById('p_nombre').value = p ? p.nombre : "";
        document.getElementById('p_contacto').value = p ? (p.contacto || "") : "";
        document.getElementById('p_telefono').value = p ? (p.telefono || "") : "";
        document.getElementById('modalProveedor').style.display = 'block';
    }

    function cerrarModal() {
        document.getElementById('modalProveedor').style.display = 'none';
    }

    async function guardar() {
        const data = {
            id: document.getElementById('p_id').value,
            nombre: document.getElementById('p_nombre').value,
            contacto: document.getElementById('p_contacto').value,
            telefono: document.getElementById('p_telefono').value,
            sucursal: parseInt(localStorage.getItem('idSucursal') || '1')
        };

        if (!data.nombre) {
            showToast("El nombre del proveedor es obligatorio", "warning");
            return;
        }

        try {
            const resp = await fetch('/api/inventario/guardar-proveedor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const res = await resp.json();
            if (res.success) {
                cerrarModal();
                cargarProveedores();
                showToast("Proveedor guardado correctamente", "success");
            } else {
                showToast("Error al guardar: " + res.message, "error");
            }
        } catch (e) { showToast("Error de conexión", "error"); }
    }

    async function eliminarProveedor(id) {
        if (!confirm('¿Estás seguro de eliminar este proveedor?')) return;
        try {
            const resp = await fetch(`/api/inventario/eliminar-proveedor/${id}`, { method: 'POST' });
            const res = await resp.json();
            if (res.success) {
                showToast(res.message, "success");
                cargarProveedores();
            } else {
                showToast("Error: " + res.message, "error");
            }
        } catch (e) { showToast("Error de conexión", "error"); }
    }

    async function desactivarProveedor(id) {
        if (!confirm('¿Desactivar este proveedor?')) return;
        try {
            const resp = await fetch(`/api/inventario/eliminar-proveedor/${id}`, { method: 'POST' });
            const res = await resp.json();
            if (res.success) {
                showToast(res.message, "success");
                cargarProveedores();
            } else {
                showToast("Error: " + res.message, "error");
            }
        } catch (e) { showToast("Error de conexión", "error"); }
    }

    async function activarProveedor(id) {
        try {
            const resp = await fetch(`/api/inventario/activar-proveedor/${id}`, { method: 'POST' });
            const res = await resp.json();
            if (res.success) {
                showToast(res.message, "success");
                cargarProveedores();
            } else {
                showToast("Error: " + res.message, "error");
            }
        } catch (e) { showToast("Error de conexión", "error"); }
    }

    window.onclick = function(event) {
        const modal = document.getElementById('modalProveedor');
        if (event.target == modal) cerrarModal();
    };

    cargarProveedores();
</script>

</body>
</html>
