<script>
    let tabActual = 'ventas';

    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fechaInicio').value = hoy;
    document.getElementById('fechaFin').value = hoy;

    function cambiarTab(btn, tipo) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tabActual = tipo;
        cargarReporte();
    }

    async function cargarReporte() {
        const fInicio = document.getElementById('fechaInicio').value;
        const fFin = document.getElementById('fechaFin').value;
        
        try {
            const resp = await fetch(`/api/reportes/${tabActual}?inicio=${fInicio}&fin=${fFin}`);
            const data = await resp.json();
            dibujarTabla(data);
        } catch (e) { console.error("Error:", e); }
    }

    function dibujarTabla(data) {
        const thead = document.getElementById('theadReporte');
        const tbody = document.getElementById('tbodyReporte');
        const sumaSpan = document.getElementById('sumaTotalPeriodo');
        thead.innerHTML = ""; tbody.innerHTML = "";

        let acumulado = 0;

        if (data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center'>No hay datos</td></tr>";
            sumaSpan.textContent = "$0.00";
            return;
        }

        if (tabActual === 'ventas') {
            thead.innerHTML = "<tr><th>ID</th><th>Fecha</th><th>Cajero</th><th>Total</th><th>Acciones</th></tr>";
            data.forEach(v => {
                acumulado += v.total;
                tbody.innerHTML += `
                    <tr>
                        <td>${v.idVenta}</td>
                        <td>${v.fecha}</td>
                        <td>${v.nombre}</td>
                        <td>$${v.total.toFixed(2)}</td>
                        <td><button class="btn-detalles" onclick="abrirDetalles(${v.idVenta}, '${v.fecha}', ${v.total})">Detalles</button></td>
                    </tr>`;
            });
        } else if (tabActual === 'productos') {
            thead.innerHTML = "<tr><th>Producto</th><th>Cant. Vendida</th><th>Total</th></tr>";
            data.forEach(p => {
                acumulado += p.total;
                tbody.innerHTML += `<tr><td>${p.nombre}</td><td>${p.cantidad}</td><td>$${p.total.toFixed(2)}</td></tr>`;
            });
        } else if (tabActual === 'cajeros') {
            thead.innerHTML = "<tr><th>Cajero</th><th>Ventas Realizadas</th><th>Total Recaudado</th></tr>";
            data.forEach(c => {
                acumulado += c.total;
                tbody.innerHTML += `<tr><td>${c.nombre}</td><td>${c.numVentas}</td><td>$${c.total.toFixed(2)}</td></tr>`;
            });
        }
        
        sumaSpan.textContent = `${acumulado.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    }

    async function abrirDetalles(id, fecha, total) {
        try {
            const resp = await fetch(`/api/reportes/detalle/${id}`);
            const productos = await resp.json();
            let filas = "";
            productos.forEach(p => {
                filas += `<tr>
                    <td>${p.cantidad}</td>
                    <td>${p.producto}</td>
                    <td style="text-align:right">$${p.subtotal.toFixed(2)}</td>
                </tr>`;
            });
            document.getElementById('t-folio').textContent = id;
            document.getElementById('t-fecha').textContent = fecha;
            document.getElementById('t-total').textContent = total.toFixed(2);
            document.getElementById('t-cuerpo').innerHTML = filas;
            document.getElementById('modalTicket').style.display = 'block';
        } catch (e) { alert("Error al cargar el detalle"); }
    }

    function cerrarModal() {
        document.getElementById('modalTicket').style.display = 'none';
    }

    cargarReporte();
    document.getElementById('user-info').textContent = "Usuario: " + (localStorage.getItem('nombreUsuario') || 'Axel');
</script>
