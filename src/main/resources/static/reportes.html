<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - MRKdito</title>
    <link rel="stylesheet" href="/estilos.css">
    <style>
        .resumen-total {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.08);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #e6edf3;
            box-shadow: var(--shadow-sm);
        }

        .resumen-total span {
            color: var(--primary);
            font-size: 20px;
        }

        .buscador-productos {
            display: none;
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 14px;
            align-items: center;
            gap: 12px;
        }

        .buscador-productos.visible { display: flex; }
        .buscador-productos label { font-weight: 600; font-size: 13px; white-space: nowrap; color: #e6edf3; }

        .buscador-productos input {
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.09);
            border-radius: 8px;
            color: #e6edf3;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            width: 280px;
            outline: none;
            transition: border-color 0.15s;
        }

        .buscador-productos input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25,163,55,0.10); }

        .btn-limpiar {
            background: rgba(255,255,255,0.05);
            border: 1.5px solid rgba(255,255,255,0.09);
            border-radius: 7px;
            padding: 7px 12px;
            cursor: pointer;
            color: #8b949e;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s;
        }

        .btn-limpiar:hover { background: rgba(255,255,255,0.09); color: #e6edf3; }

        .btn-detalles {
            background: rgba(37,99,235,0.15);
            color: #60a5fa;
            border: none;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: filter 0.15s;
        }

        .btn-detalles:hover { filter: brightness(1.1); }

        /* Ticket modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,30,0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            overflow-y: auto;
            padding: 40px 16px;
        }

        .modal-content {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.09);
            margin: 0 auto;
            padding: 24px;
            width: 320px;
            border-radius: 14px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: modalIn 0.2s ease;
            color: #e6edf3;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .ticket-header {
            text-align: center;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            margin-bottom: 12px;
            padding-bottom: 12px;
        }

        .ticket-header h2 {
            font-size: 18px;
            font-weight: 800;
            color: #e6edf3;
            margin-bottom: 4px;
        }

        .ticket-table { width: 100%; font-size: 12.5px; border-collapse: collapse; }
        .ticket-table th, .ticket-table td { border: none; padding: 4px 0; }

        .ticket-total {
            text-align: right;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .btn-cerrar {
            width: 100%;
            background: rgba(255,255,255,0.08);
            color: #e6edf3;
            border: none;
            padding: 10px;
            margin-top: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-cerrar:hover { background: rgba(255,255,255,0.13); }

        /* Filters row */
        .report-filters {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .filter-field { display: flex; flex-direction: column; gap: 5px; }
        .filter-field label { font-size: 11.5px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.4px; }
        .filter-field input,
        .filter-field select { padding: 8px 11px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.09); color: #e6edf3; border-radius: 8px; font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.15s; }
        .filter-field input:focus,
        .filter-field select:focus { border-color: var(--primary); }
        .filter-field select option { background-color: #1c2128; color: #e6edf3; }

        .btn-consultar {
            padding: 9px 22px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 14px;
            transition: filter 0.15s;
            white-space: nowrap;
        }

        .btn-consultar:hover { filter: brightness(0.9); }

        /* Light mode overrides */
        [data-theme="light"] .resumen-total { background: #ffffff; border-color: rgba(0,0,0,0.08); color: #111827; }
        [data-theme="light"] .buscador-productos { background: #ffffff; border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .buscador-productos label { color: #374151; }
        [data-theme="light"] .buscador-productos input { background: #f9fafb; border-color: rgba(0,0,0,0.10); color: #111827; }
        [data-theme="light"] .report-filters { background: #ffffff; border-color: rgba(0,0,0,0.08); }
        [data-theme="light"] .filter-field label { color: #6b7280; }
        [data-theme="light"] .filter-field input,
        [data-theme="light"] .filter-field select { background: #f9fafb; border-color: rgba(0,0,0,0.10); color: #111827; }
        [data-theme="light"] .filter-field select option { background-color: #ffffff; color: #111827; }
        [data-theme="light"] .btn-limpiar { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.09); color: #6b7280; }
        [data-theme="light"] .btn-limpiar:hover { background: rgba(0,0,0,0.09); color: #374151; }
        [data-theme="light"] .ticket-header { border-bottom-color: rgba(0,0,0,0.15); }
        [data-theme="light"] .ticket-header h2 { color: #111827; }
        [data-theme="light"] .ticket-total { border-top-color: rgba(0,0,0,0.15); color: #111827; }
        [data-theme="light"] .btn-cerrar { background: rgba(0,0,0,0.06); color: #374151; }
        [data-theme="light"] .btn-cerrar:hover { background: rgba(0,0,0,0.10); }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div id="layout" class="app-layout">
    <!-- sidebar injected by sidebar.js -->
    <div class="page-content">
        <header class="content-header">
            <h1 class="page-title"><span>📊</span> Reportes</h1>
            <div class="header-actions">
                <span id="user-info" class="text-muted text-sm"></span>
            </div>
        </header>
        <div class="content-scroll">

            <!-- Date Filters -->
            <div class="report-filters">
                <div class="filter-field">
                    <label>Desde</label>
                    <input type="date" id="fechaInicio">
                    <input type="time" id="horaInicio" value="00:00" style="margin-top:4px">
                </div>
                <div class="filter-field">
                    <label>Hasta</label>
                    <input type="date" id="fechaFin">
                    <input type="time" id="horaFin" value="23:59" style="margin-top:4px">
                </div>
                <div class="filter-field" id="filtroCategoriaWrap" style="display:none">
                    <label>Categoría</label>
                    <select id="selCategoria" onchange="cargarReporte()">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <button class="btn-consultar" onclick="cargarReporte()">🔍 Consultar</button>
            </div>

            <!-- Tabs -->
            <div class="tab-bar mb-4">
                <button class="tab-btn active" onclick="cambiarTab(this, 'ventas')">Ventas Diarias</button>
                <button class="tab-btn" onclick="cambiarTab(this, 'productos')">Top Productos</button>
                <button class="tab-btn" onclick="cambiarTab(this, 'cajeros')">Por Cajero</button>
                <button class="tab-btn" onclick="cambiarTab(this, 'inventario')">Valor Inventario</button>
                <button class="tab-btn" onclick="cambiarTab(this, 'entradas')">📥 Entradas de Inventario</button>
            </div>

            <!-- Product search (products tab only) -->
            <div id="buscadorProductos" class="buscador-productos">
                <label>Buscar producto:</label>
                <input type="text" id="inputBusqueda" placeholder="Nombre o código de barras..." oninput="onBusquedaInput()">
                <button class="btn-limpiar" onclick="limpiarBusqueda()">✕ Limpiar</button>
            </div>

            <!-- Summary ventas -->
            <div id="resumenVentas" class="resumen-total" style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;">
                <div>Total: <span id="sumaTotalPeriodo">$0.00</span></div>
                <div id="resumenEfectivoDiv" style="display:none;font-size:15px;font-weight:600">💵 Efectivo: <span id="sumaEfectivo" style="color:#4ade80;font-size:18px">$0.00</span></div>
                <div id="resumenTarjetaDiv" style="display:none;font-size:15px;font-weight:600">💳 Tarjeta: <span id="sumaTarjeta" style="color:#60a5fa;font-size:18px">$0.00</span></div>
            </div>
            <!-- Summary entradas -->
            <div id="resumenEntradas" class="resumen-total" style="display:none;gap:28px;flex-wrap:wrap;">
                <div>📥 Movimientos: <span id="ent-totalMovimientos" style="font-size:20px">0</span></div>
                <div style="font-size:15px;font-weight:600">Unidades Ingresadas: <span id="ent-totalUnidades" style="color:var(--primary);font-size:20px">0</span></div>
            </div>

            <!-- Data table -->
            <div class="card">
                <div class="table-wrap" id="contenedorTabla">
                    <table>
                        <thead id="theadReporte"></thead>
                        <tbody id="tbodyReporte"></tbody>
                    </table>
                </div>
                <div class="pagination-bar" id="paginacion"></div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Ticket -->
<div id="modalTicket" class="modal">
    <div class="modal-content">
        <div class="ticket-header">
            <h2>MRKdito</h2>
            <p style="margin:4px 0;font-size:13px">Folio: <span id="t-folio"></span></p>
            <p style="font-size:11px;color:#6b7280" id="t-fecha"></p>
        </div>
        <table class="ticket-table">
            <thead>
                <tr>
                    <th style="text-align:left">Cant</th>
                    <th style="text-align:left">Producto</th>
                    <th style="text-align:right">Sub</th>
                </tr>
            </thead>
            <tbody id="t-cuerpo"></tbody>
        </table>
        <div class="ticket-total">TOTAL: $<span id="t-total"></span></div>
        <button class="btn-cerrar" onclick="cerrarModal()">CERRAR</button>
    </div>
</div>

<script src="/sidebar.js"></script>
<script>
    const idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
    if (!idSucursal || !localStorage.getItem('userId')) {
        window.location.href = '/sucursal.html';
    }
    document.documentElement.style.setProperty('--primary', localStorage.getItem('colorSucursal') || '#19A337');

    let tabActual = 'ventas';
    let paginaActual = 1;
    let tamanoPagina = 50;
    let infoPaginacion = { totalPaginas: 1, totalRegistros: 0 };
    let busquedaTimeout = null;

    async function cargarCategorias() {
        try {
            const suc = parseInt(localStorage.getItem('idSucursal') || '1');
            const resp = await fetch(`/api/reportes/categorias?sucursal=${suc}`);
            if (!resp.ok) return;
            const cats = await resp.json();
            if (!Array.isArray(cats)) return;
            const sel = document.getElementById('selCategoria');
            const valorActual = sel.value;
            sel.innerHTML = '<option value="">Todas las categorías</option>';
            cats.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                sel.appendChild(opt);
            });
            if (valorActual && [...sel.options].some(o => o.value === valorActual)) {
                sel.value = valorActual;
            }
        } catch (e) { console.error("Error cargando categorías", e); }
    }

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
        toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fechaInicio').value = hoy;
    document.getElementById('fechaFin').value = hoy;

    function cambiarTab(btn, tipo) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tabActual = tipo;
        paginaActual = 1;
        document.getElementById('inputBusqueda').value = '';
        document.getElementById('buscadorProductos').style.display = (tipo === 'productos' || tipo === 'entradas') ? 'flex' : 'none';
        document.getElementById('filtroCategoriaWrap').style.display = tipo === 'ventas' ? '' : 'none';
        if (tipo !== 'ventas') {
            document.getElementById('resumenEfectivoDiv').style.display = 'none';
            document.getElementById('resumenTarjetaDiv').style.display  = 'none';
            document.getElementById('selCategoria').value = '';
        }
        document.getElementById('resumenVentas').style.display   = tipo === 'entradas' ? 'none' : 'flex';
        document.getElementById('resumenEntradas').style.display = tipo === 'entradas' ? 'flex' : 'none';
        cargarReporte();
    }

    function onBusquedaInput() {
        clearTimeout(busquedaTimeout);
        busquedaTimeout = setTimeout(() => {
            paginaActual = 1;
            cargarReporte();
        }, 350);
    }

    function limpiarBusqueda() {
        document.getElementById('inputBusqueda').value = '';
        paginaActual = 1;
        cargarReporte();
    }

    async function cargarReporte() {
        const fInicio = document.getElementById('fechaInicio').value;
        const hInicio = document.getElementById('horaInicio').value;
        const fFin = document.getElementById('fechaFin').value;
        const hFin = document.getElementById('horaFin').value;

        paginaActual = 1;

        try {
            const suc = parseInt(localStorage.getItem('idSucursal') || '1');
            let url;
            if (tabActual === 'inventario') {
                url = `/api/reportes/${tabActual}?sucursal=${suc}`;
            } else if (tabActual === 'entradas') {
                url = `/api/inventario/reporte-entradas?fechaInicio=${fInicio}&fechaFin=${fFin}&sucursal=${suc}`;
                const filtro = document.getElementById('inputBusqueda').value.trim();
                if (filtro) url += `&filtro=${encodeURIComponent(filtro)}`;
            } else {
                url = `/api/reportes/${tabActual}?inicio=${fInicio}&horaInicio=${hInicio}&fin=${fFin}&horaFin=${hFin}&sucursal=${suc}`;
                if (tabActual === 'ventas' || tabActual === 'productos') {
                    url += `&pagina=${paginaActual}&tamano=${tamanoPagina}`;
                }
                if (tabActual === 'ventas') {
                    const cat = document.getElementById('selCategoria').value.trim();
                    if (cat) url += `&categoria=${encodeURIComponent(cat)}`;
                }
                if (tabActual === 'productos') {
                    const busqueda = document.getElementById('inputBusqueda').value.trim();
                    if (busqueda) url += `&busqueda=${encodeURIComponent(busqueda)}`;
                }
            }

            const resp = await fetch(url);
            const data = await resp.json();
            dibujarTabla(data);
        } catch (e) { console.error("Error:", e); }
    }

    function dibujarTabla(data) {
        const thead = document.getElementById('theadReporte');
        const tbody = document.getElementById('tbodyReporte');
        const sumaSpan = document.getElementById('sumaTotalPeriodo');
        const paginacionDiv = document.getElementById('paginacion');
        thead.innerHTML = ""; tbody.innerHTML = "";

        let acumulado = 0;
        let datosMostrar = data;

        infoPaginacion = {};
        let totalGeneralPagina = 0;

        if (tabActual === 'inventario' && data && data.totalCompra !== undefined) {
            thead.innerHTML = "<tr><th>Concepto</th><th>Valor Total</th></tr>";
            tbody.innerHTML = `<tr><td>Valor de compra (inversión)</td><td>$${Number(data.totalCompra).toFixed(2)}</td></tr>`;
            tbody.innerHTML += `<tr><td><strong>Valor de venta (potencial)</strong></td><td><strong>$${Number(data.totalVenta).toFixed(2)}</strong></td></tr>`;
            sumaSpan.textContent = "$" + Number(data.totalVenta).toFixed(2);
            paginacionDiv.innerHTML = "";
            return;
        } else if ((tabActual === 'ventas' || tabActual === 'productos') && data.length > 0) {
            const ultimo = data[data.length - 1];
            if (ultimo.totalRegistros !== undefined) {
                infoPaginacion = {
                    totalPaginas: ultimo.totalPaginas,
                    totalRegistros: ultimo.totalRegistros,
                    paginaActual: ultimo.paginaActual,
                    totalGeneral: ultimo.totalGeneral
                };
                totalGeneralPagina = Number(ultimo.totalGeneral) || 0;
                datosMostrar = data.slice(0, -1);

                if (tabActual === 'ventas' && ultimo.totalEfectivo !== undefined) {
                    document.getElementById('sumaEfectivo').textContent = '$' + Number(ultimo.totalEfectivo).toFixed(2);
                    document.getElementById('sumaTarjeta').textContent  = '$' + Number(ultimo.totalTarjeta).toFixed(2);
                    document.getElementById('resumenEfectivoDiv').style.display = '';
                    document.getElementById('resumenTarjetaDiv').style.display  = '';
                } else {
                    document.getElementById('resumenEfectivoDiv').style.display = 'none';
                    document.getElementById('resumenTarjetaDiv').style.display  = 'none';
                }
            }
        }

        let totalMostrar = totalGeneralPagina;
        if (totalMostrar === 0 && datosMostrar.length > 0) {
            datosMostrar.forEach(v => acumulado += v.total);
            totalMostrar = acumulado;
        }

        if (tabActual !== 'inventario') {
            sumaSpan.textContent = "$" + totalMostrar.toFixed(2);
        }

        if (tabActual === 'inventario') return;

        if (tabActual === 'entradas') {
            const entradas = (data && data.entradas) ? data.entradas : [];
            document.getElementById('ent-totalMovimientos').textContent = data.totalEntradas || 0;
            const tc = data.totalCantidad || 0;
            document.getElementById('ent-totalUnidades').textContent = (tc % 1 === 0) ? tc : tc.toFixed(3);
            thead.innerHTML = "<tr><th>Fecha</th><th>Producto</th><th>Código</th><th>Proveedor</th><th>Cantidad</th><th>Usuario</th><th>Nota</th></tr>";
            if (entradas.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;padding:30px;color:#9ca3af'>No hay entradas en el período seleccionado</td></tr>";
            } else {
                tbody.innerHTML = entradas.map(e => {
                    const fecha = new Date(e.fecha_entrada).toLocaleString('es-MX', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                    const cant = (e.cantidad % 1 === 0) ? e.cantidad : parseFloat(e.cantidad).toFixed(3);
                    return `<tr>
                        <td style="white-space:nowrap">${fecha}</td>
                        <td style="font-weight:600">${e.nombre_producto || '—'}</td>
                        <td style="color:#8b949e;font-size:12px">${e.codigo_barras || '—'}</td>
                        <td>${e.nombre_proveedor || '—'}</td>
                        <td><span style="background:rgba(22,163,74,0.15);color:#4ade80;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700">+${cant}</span></td>
                        <td>${e.nombre_usuario || '—'}</td>
                        <td style="color:#8b949e">${e.nota || '—'}</td>
                    </tr>`;
                }).join('');
            }
            paginacionDiv.innerHTML = "";
            return;
        }

        if (datosMostrar.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;padding:30px;color:#9ca3af'>No hay datos para el período seleccionado</td></tr>";
            paginacionDiv.innerHTML = "";
            return;
        }

        if (tabActual === 'ventas') {
            thead.innerHTML = "<tr><th>No. Venta</th><th>Fecha</th><th>Cajero</th><th>Total</th><th>Pago</th><th>Acciones</th></tr>";
            datosMostrar.forEach(v => {
                const fechaDate = new Date(v.fecha);
                const fechaFormateada = fechaDate.toLocaleString('es-MX', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: true,
                    timeZone: 'America/Mexico_City'
                });
                const ef = Number(v.montoEfectivo) || 0;
                const tj = Number(v.montoTarjeta)  || 0;
                let pagoBadge;
                if (ef > 0 && tj > 0) {
                    pagoBadge = `<span style="font-size:11px;font-weight:600;color:#fbbf24">⚡ Mixto</span>`;
                } else if (tj > 0) {
                    pagoBadge = `<span style="font-size:11px;font-weight:600;color:#60a5fa">💳 Tarjeta</span>`;
                } else {
                    pagoBadge = `<span style="font-size:11px;font-weight:600;color:#4ade80">💵 Efectivo</span>`;
                }
                tbody.innerHTML += `
                    <tr>
                        <td><strong>#${v.numeroVenta}</strong></td>
                        <td>${fechaFormateada}</td>
                        <td>${v.nombre}</td>
                        <td style="font-weight:700">$${v.total.toFixed(2)}</td>
                        <td>${pagoBadge}</td>
                        <td><button class="btn-detalles" onclick="abrirDetalles(${v.idVenta}, '${v.fecha}', ${v.total}, ${v.numeroVenta})">Ver detalle</button></td>
                    </tr>`;
            });
            dibujarPaginacion();
        } else if (tabActual === 'productos') {
            thead.innerHTML = "<tr><th>Producto</th><th>Cant. Vendida</th><th>Total</th></tr>";
            datosMostrar.forEach(p => {
                acumulado += p.total;
                tbody.innerHTML += `<tr><td>${p.nombre}</td><td>${Number(p.cantidad).toFixed(3)}</td><td style="font-weight:700">$${Number(p.total).toFixed(2)}</td></tr>`;
            });
            dibujarPaginacion();
        } else if (tabActual === 'cajeros') {
            thead.innerHTML = "<tr><th>Cajero</th><th>Ventas Realizadas</th><th>Total Recaudado</th></tr>";
            datosMostrar.forEach(c => {
                acumulado += c.total;
                tbody.innerHTML += `<tr><td>${c.nombre}</td><td><strong>${c.numVentas}</strong></td><td style="font-weight:700">$${c.total.toFixed(2)}</td></tr>`;
            });
            paginacionDiv.innerHTML = "";
        }
    }

    function dibujarPaginacion() {
        const paginacionDiv = document.getElementById('paginacion');
        if (tabActual !== 'ventas' && tabActual !== 'productos') {
            paginacionDiv.innerHTML = "";
            return;
        }

        const titulo = tabActual === 'ventas' ? 'ventas' : 'productos';
        let html = `<button onclick="cambiarPagina(-1)" ${paginaActual === 1 ? 'disabled' : ''}>« Anterior</button>`;
        html += `<span>Página ${paginaActual} de ${infoPaginacion.totalPaginas} (${infoPaginacion.totalRegistros} ${titulo})</span>`;
        html += `<button onclick="cambiarPagina(1)" ${paginaActual >= infoPaginacion.totalPaginas ? 'disabled' : ''}>Siguiente »</button>`;
        paginacionDiv.innerHTML = html;
    }

    function cambiarPagina(direccion) {
        const nuevaPagina = paginaActual + direccion;
        if (nuevaPagina >= 1 && nuevaPagina <= infoPaginacion.totalPaginas) {
            paginaActual = nuevaPagina;
            cambiarPaginaReporte();
        }
    }

    async function cambiarPaginaReporte() {
        const fInicio = document.getElementById('fechaInicio').value;
        const hInicio = document.getElementById('horaInicio').value;
        const fFin = document.getElementById('fechaFin').value;
        const hFin = document.getElementById('horaFin').value;

        try {
            const suc = parseInt(localStorage.getItem('idSucursal') || '1');
            let url;
            if (tabActual === 'inventario') {
                url = `/api/reportes/${tabActual}?sucursal=${suc}`;
            } else if (tabActual === 'entradas') {
                url = `/api/inventario/reporte-entradas?fechaInicio=${fInicio}&fechaFin=${fFin}&sucursal=${suc}`;
                const filtro = document.getElementById('inputBusqueda').value.trim();
                if (filtro) url += `&filtro=${encodeURIComponent(filtro)}`;
            } else {
                url = `/api/reportes/${tabActual}?inicio=${fInicio}&horaInicio=${hInicio}&fin=${fFin}&horaFin=${hFin}&sucursal=${suc}`;
                if (tabActual === 'ventas' || tabActual === 'productos') {
                    url += `&pagina=${paginaActual}&tamano=${tamanoPagina}`;
                }
                if (tabActual === 'ventas') {
                    const cat = document.getElementById('selCategoria').value.trim();
                    if (cat) url += `&categoria=${encodeURIComponent(cat)}`;
                }
                if (tabActual === 'productos') {
                    const busqueda = document.getElementById('inputBusqueda').value.trim();
                    if (busqueda) url += `&busqueda=${encodeURIComponent(busqueda)}`;
                }
            }

            const resp = await fetch(url);
            const data = await resp.json();
            dibujarTabla(data);
        } catch (e) { console.error("Error:", e); }
    }

    let ultimoNumeroVenta = 0;

    async function abrirDetalles(id, fecha, total, numeroVenta) {
        ultimoNumeroVenta = numeroVenta || id;
        try {
            const resp = await fetch(`/api/reportes/detalle/${id}`);
            const productos = await resp.json();
            const tbody = document.getElementById('t-cuerpo');
            tbody.innerHTML = '';

            for (let i = 0; i < productos.length; i++) {
                const p = productos[i];
                if (!p.producto) continue;

                const tr = document.createElement('tr');
                const tdCant = document.createElement('td');
                tdCant.textContent = Number(p.cantidad).toFixed(3);
                const tdProd = document.createElement('td');
                tdProd.textContent = p.producto;
                const tdSub = document.createElement('td');
                tdSub.textContent = '$' + Number(p.subtotal).toFixed(2);
                tdSub.style.textAlign = 'right';
                tr.appendChild(tdCant);
                tr.appendChild(tdProd);
                tr.appendChild(tdSub);
                tbody.appendChild(tr);
            }

            document.getElementById('t-folio').textContent = ultimoNumeroVenta;
            document.getElementById('t-fecha').textContent = fecha;
            document.getElementById('t-total').textContent = total.toFixed(2);
            document.getElementById('modalTicket').style.display = 'block';
        } catch (e) { showToast("Error al cargar el detalle", "error"); }
    }

    function cerrarModal() {
        document.getElementById('modalTicket').style.display = 'none';
    }

    window.onclick = function(e) {
        if (e.target === document.getElementById('modalTicket')) cerrarModal();
    };

    document.getElementById('filtroCategoriaWrap').style.display = '';
    cargarCategorias();
    cargarReporte();
    document.getElementById('user-info').textContent = "Usuario: " + (localStorage.getItem('nombreUsuario') || 'Cajero');
</script>

</body>
</html>
