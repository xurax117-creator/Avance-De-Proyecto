<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Sucursal - MRKdito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            background: #080c10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25,163,55,0.14) 0%, transparent 65%);
            bottom: -150px;
            right: -150px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25,163,55,0.08) 0%, transparent 65%);
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        .brand {
            text-align: center;
            margin-bottom: 48px;
        }

        .brand-logo-card {
            display: inline-block;
            background: white;
            border-radius: 20px;
            padding: 16px 28px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 48px rgba(0,0,0,0.5);
        }

        .brand img {
            width: 200px;
            display: block;
        }

        .brand-subtitle {
            margin-top: 16px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        .section-label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.45);
            margin-bottom: 24px;
            text-align: center;
        }

        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sucursal-card {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            padding: 36px 40px;
            min-width: 220px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
            backdrop-filter: blur(12px);
        }

        .sucursal-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.07);
        }

        .sucursal-card:hover { border-color: var(--c); }

        .card-icon {
            font-size: 2.8em;
            margin-bottom: 16px;
            display: block;
        }

        .card-name {
            font-size: 15px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .card-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 7px;
            vertical-align: middle;
        }

        .card-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 22px;
            border: none;
            border-radius: 30px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            pointer-events: none;
        }

        .sucursal-card:hover .card-btn { opacity: 0.9; }
        .sucursal-card:active .card-btn { transform: scale(0.97); }

        .loading-text {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            text-align: center;
        }

        .error-text {
            color: #f87171;
            font-size: 14px;
            text-align: center;
            display: none;
            margin-top: 16px;
        }

        .footer-note {
            margin-top: 48px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="brand-logo-card">
            <img src="/mrkdito logo sin fondo real.png" alt="MRKdito">
        </div>
        <p class="brand-subtitle">Sistema Punto de Venta</p>
    </div>

    <p class="section-label">Selecciona tu sucursal para continuar</p>

    <div class="grid" id="grid">
        <p class="loading-text">Cargando sucursales...</p>
    </div>
    <p id="error-msg" class="error-text">No se pudieron cargar las sucursales. Recarga la página.</p>

    <p class="footer-note">MRKdito POS &mdash; Todos los derechos reservados</p>

    <script>
        window.onload = async () => {
            if (localStorage.getItem('idSucursal') && localStorage.getItem('userId')) {
                window.location.href = '/menu.html';
                return;
            }
            localStorage.removeItem('userId');
            localStorage.removeItem('nombreUsuario');
            localStorage.removeItem('rolUsuario');

            try {
                const resp = await fetch('/api/sucursales/activas');
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const sucursales = await resp.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                if (sucursales.length === 0) {
                    grid.innerHTML = '<p class="loading-text">No hay sucursales configuradas.</p>';
                    return;
                }

                sucursales.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'sucursal-card';
                    card.style.setProperty('--c', s.color);
                    card.style.borderColor = 'rgba(255,255,255,0.09)';
                    card.innerHTML = `
                        <span class="card-icon">🏪</span>
                        <div class="card-name">
                            <span class="card-dot" style="background:${s.color}"></span>${s.nombre}
                        </div>
                        <button class="card-btn" style="background:${s.color}">Entrar &rarr;</button>
                    `;
                    card.onmouseenter = () => card.style.borderColor = s.color;
                    card.onmouseleave = () => card.style.borderColor = 'rgba(255,255,255,0.09)';
                    card.onclick = () => seleccionarSucursal(s);
                    grid.appendChild(card);
                });
            } catch (e) {
                document.querySelector('.loading-text').style.display = 'none';
                document.getElementById('error-msg').style.display = 'block';
                console.error(e);
            }
        };

        function seleccionarSucursal(s) {
            localStorage.setItem('idSucursal', s.id);
            localStorage.setItem('nombreSucursal', s.nombre);
            localStorage.setItem('colorSucursal', s.color);
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
