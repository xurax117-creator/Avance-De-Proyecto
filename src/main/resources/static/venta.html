<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto de Venta - MRKdito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }

        .pos-layout {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .pos-header {
            background: #1e293b;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 20px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .pos-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .pos-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.10);
            color: rgba(255,255,255,0.65);
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }

        .pos-back-btn:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        .pos-title {
            font-size: 15px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.2px;
        }

        .pos-branch-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
        }

        .pos-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #user-info {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
        }

        /* ── SCAN BAR ── */
        .scan-bar {
            background: #1e293b;
            padding: 12px 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        #txtClave {
            padding: 11px 16px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 9px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #txtClave::placeholder { color: rgba(255,255,255,0.3); }
        #txtClave:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25,163,55,0.2);
        }

        .scan-bar .btn-add {
            padding: 11px 22px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 9px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: filter 0.15s;
            white-space: nowrap;
        }

        .scan-bar .btn-add:hover { filter: brightness(0.9); }

        /* ── CART TABLE ── */
        .cart-area {
            flex: 1;
            overflow-y: auto;
            background: #f0f4f9;
        }

        .cart-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .cart-table thead th {
            background: #1e293b;
            color: rgba(255,255,255,0.55);
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            padding: 10px 14px;
            border-bottom: none;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .cart-table tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13.5px;
            background: white;
            vertical-align: middle;
        }

        .cart-table tbody tr:hover td { background: #f9fafb; }

        .product-foto {
            width: 46px;
            height: 46px;
            border-radius: 9px;
            object-fit: cover;
            border: 1px solid #e5e7eb;
        }

        .no-foto {
            width: 46px;
            height: 46px;
            border-radius: 9px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 1px solid #e5e7eb;
        }

        .badge-cantidad {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            display: inline-block;
            font-size: 13px;
            transition: filter 0.15s;
        }

        .badge-cantidad:hover { filter: brightness(0.9); }

        .promocion-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid #fde68a;
        }

        .btn-eliminar-item {
            padding: 5px 12px;
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: background 0.15s;
        }

        .btn-eliminar-item:hover { background: #fecaca; }

        /* ── TOTAL BAR ── */
        .total-bar {
            background: #1e293b;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .total-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        #lblTotal {
            font-size: 24px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        #lblVentaId {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        .total-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-cobrar {
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
            letter-spacing: 0.3px;
        }

        .btn-cobrar:hover { filter: brightness(0.9); }
        .btn-cobrar:active { transform: scale(0.98); }

        .btn-cancelar-venta {
            padding: 12px 20px;
            background: rgba(220,38,38,0.15);
            color: #f87171;
            border: 1px solid rgba(220,38,38,0.25);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-cancelar-venta:hover { background: rgba(220,38,38,0.25); }

        .btn-espera {
            padding: 12px 18px;
            background: rgba(217,119,6,0.15);
            color: #f59e0b;
            border: 1px solid rgba(217,119,6,0.25);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-espera:hover { background: rgba(217,119,6,0.25); }

        .btn-ver-espera {
            padding: 12px 18px;
            background: rgba(37,99,235,0.15);
            color: #60a5fa;
            border: 1px solid rgba(37,99,235,0.25);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-ver-espera:hover { background: rgba(37,99,235,0.25); }

        /* ── MODALS (common) ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10,15,30,0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 440px;
            padding: 28px;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-content h3 {
            margin: 0 0 20px;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            text-align: center;
        }

        .modal-row { margin-bottom: 16px; }
        .modal-row label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }

        .modal-row .amount {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            letter-spacing: -1px;
        }

        .modal-row input[type="number"] {
            width: 100%;
            padding: 13px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            outline: none;
            box-sizing: border-box;
            color: #111827;
        }

        .modal-row input[type="number"]:focus { box-shadow: 0 0 0 3px rgba(25,163,55,0.15); }

        .modal-result {
            background: #f0f4f9;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            margin: 14px 0;
        }

        .modal-result .change {
            font-size: 32px;
            font-weight: 800;
            color: #dc2626;
            letter-spacing: -1px;
        }

        .modal-result p { font-size: 12px; color: #6b7280; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .modal-buttons button { flex: 1; }
        .btn-pagar { background: var(--primary) !important; color: white !important; font-size: 15px !important; font-weight: 700 !important; }
        .modal-buttons .btn-cancelar { background: #f3f4f6 !important; color: #374151 !important; font-size: 14px !important; font-weight: 600 !important; }

        /* Search modal */
        #modalBusqueda .modal-content { max-width: 520px; max-height: 80vh; overflow-y: auto; padding: 24px; }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .search-result-item:hover { border-color: var(--primary); background: #f0fdf4; }

        .search-result-item img {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e5e7eb;
        }

        /* Waiting sales modal */
        #modalVentasEspera .modal-content { max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 24px; }

        .venta-espera-item {
            padding: 14px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: #f9fafb;
        }

        .venta-espera-item:hover { border-color: var(--primary); background: #f0fdf4; }

        .venta-espera-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .venta-espera-user { font-size: 13px; font-weight: 700; color: #111827; }
        .venta-espera-fecha { font-size: 11.5px; color: #6b7280; }
        .venta-espera-productos { font-size: 12.5px; color: #6b7280; margin-bottom: 8px; }
        .venta-espera-total { font-size: 18px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    </style>
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<div class="pos-layout">

    <!-- HEADER -->
    <div class="pos-header">
        <div class="pos-header-left">
            <button class="pos-back-btn" onclick="window.location.href='/menu.html'">← Menú</button>
            <span class="pos-title">Terminal de Venta</span>
        </div>
        <div class="pos-header-right">
            <span id="user-info" style="font-size:13px;color:rgba(255,255,255,0.5)"></span>
        </div>
    </div>

    <!-- SCAN BAR -->
    <div class="scan-bar" id="panel-arriba">
        <input type="text" id="txtClave" placeholder="Escanear código de barras o escribir nombre del producto..." onkeypress="if(event.key === 'Enter') agregarProducto()" autofocus>
        <button class="btn-add" onclick="agregarProducto()">+ Agregar</button>
    </div>

    <!-- CART TABLE -->
    <div class="cart-area">
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Stock</th>
                    <th>Cant.</th>
                    <th>Precio Unit.</th>
                    <th>Promoción</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <!-- TOTAL BAR -->
    <div class="total-bar">
        <div class="total-info">
            <div id="lblTotal">Total: $0.00</div>
            <div id="lblVentaId">Venta ID: -1</div>
        </div>
        <div class="total-actions">
            <button class="btn-espera" onclick="ponerEnEspera()">⏳ En Espera</button>
            <button class="btn-ver-espera" onclick="abrirVentasEnEspera()">📋 Ver Esperas</button>
            <button class="btn-cancelar-venta" onclick="confirmarCancelacion()">✕ Cancelar</button>
            <button class="btn-cobrar" onclick="abrirModalPago()">✓ COBRAR</button>
        </div>
    </div>
</div>

<!-- Modal de Pago -->
<div id="modalPago" class="modal-overlay">
    <div class="modal-content">
        <h3>💰 Cobrar Venta</h3>
        <div class="modal-row">
            <label>Total a Cobrar</label>
            <div id="modalTotal" class="amount">$0.00</div>
        </div>
        <div class="modal-row">
            <label>¿Con cuánto te pagan?</label>
            <input type="number" id="txtPago" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="modal-result">
            <p>Cambio a Devolver</p>
            <div id="modalCambio" class="change">$0.00</div>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-secondary btn-cancelar" onclick="cerrarModalPago()">Cancelar</button>
            <button class="btn btn-primary btn-pagar" onclick="confirmarPago()">✓ Confirmar Pago</button>
        </div>
    </div>
</div>

<!-- Modal de búsqueda de productos -->
<div id="modalBusqueda" class="modal-overlay">
    <div class="modal-content">
        <h3>🔍 Seleccionar Producto</h3>
        <div id="resultadosBusqueda" style="margin-top:8px;"></div>
        <div class="modal-buttons" style="margin-top:16px;">
            <button class="btn btn-secondary btn-cancelar" onclick="cerrarModalBusqueda()">Cerrar</button>
        </div>
    </div>
</div>

<!-- Modal de ventas en espera -->
<div id="modalVentasEspera" class="modal-overlay">
    <div class="modal-content">
        <h3>📋 Ventas en Espera</h3>
        <div id="listaVentasEspera" style="margin-top:8px;"></div>
        <div class="modal-buttons" style="margin-top:16px;">
            <button class="btn btn-secondary btn-cancelar" onclick="cerrarModalVentasEspera()">Cerrar</button>
        </div>
    </div>
</div>

<script>
         const _idSucursal = parseInt(localStorage.getItem('idSucursal') || '0');
         if (!_idSucursal || !localStorage.getItem('userId')) {
             window.location.href = '/sucursal.html';
         }
         document.documentElement.style.setProperty('--primary', localStorage.getItem('colorSucursal') || '#19A337');

         let listaCarrito = [];
         let currentVentaId = -1;
         let totalVenta = 0;
         let currentUserId = localStorage.getItem('userId') || 1;
         let procesando = false;
         const txtClave = document.getElementById('txtClave');
         const cuerpoTabla = document.getElementById('cuerpoTabla');
         let carritoIdCounter = 0;

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
            toast.innerHTML = `<span>${icons[type] || 'ℹ'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function mostrarSugerencias(productos) {
            const container = document.getElementById('resultadosBusqueda');
            container.innerHTML = '';

            productos.forEach(p => {
                let fotoHtml;
                if (p.fotoProducto) {
                    fotoHtml = `<img src="data:image/jpeg;base64,${p.fotoProducto}" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover;">`;
                } else {
                    fotoHtml = `<div style="width: 40px; height: 40px; border-radius: 6px; background: #f1f1f1; display: flex; align-items: center; justify-content: center;">📦</div>`;
                }

                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.onclick = () => seleccionarProductoBusqueda(p);

                div.innerHTML = `
                    ${fotoHtml}
                    <div style="flex: 1;">
                        <div style="font-weight: 600; color: #333;">${p.nombre}</div>
                        <div style="font-size: 12px; color: #666;">Código: ${p.codigoBarras || p.codigo_barras || 'N/A'}</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 18px; font-weight: bold; color: #19A337;">${p.precioVenta.toFixed(2)}</div>
                        <div style="font-size: 12px; color: ${p.stockActual <= 5 ? '#dc3545' : '#666'};">Stock: ${p.stockActual}</div>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('modalBusqueda').classList.add('active');
        }

        function cerrarModalBusqueda() {
            document.getElementById('modalBusqueda').classList.remove('active');
            txtClave.focus();
        }

        function seleccionarProductoBusqueda(producto) {
            document.getElementById('modalBusqueda').classList.remove('active');
            agregarProductoDesdeBusqueda(producto);
        }

        async function agregarProductoDesdeBusqueda(producto) {
            if (procesando) return;
            procesando = true;

            try {
                if (currentVentaId === -1) {
                    const resVenta = await fetch('/api/venta/producto', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codigo: producto.codigoBarras || producto.codigo_barras, idVentaActual: -1, userId: parseInt(currentUserId), idSucursal: parseInt(localStorage.getItem('idSucursal') || '1') })
                    });
                    const resultVenta = await resVenta.json();
                    if (resultVenta.success) {
                        currentVentaId = resultVenta.data.idVenta;
                        document.getElementById('lblVentaId').textContent = `Venta ID: ${currentVentaId}`;
                    }
                }

                const item = listaCarrito.find(x => x.idProducto === producto.id_producto || x.idProducto === producto.idProducto);
                if (item) {
                    item.cantidad++;
                } else {
                    listaCarrito.unshift({
                        carritoId: ++carritoIdCounter,
                        idProducto: producto.id_producto || producto.idProducto,
                        codigo: producto.codigoBarras || producto.codigo_barras || '',
                        nombre: producto.nombre,
                        precioOriginal: producto.precio_venta || producto.precioVenta,
                        precio: producto.precio_venta || producto.precioVenta,
                        cantidad: 1,
                        stockActual: producto.stockActual,
                        fotoProducto: producto.fotoProducto || null,
                        promocionAplicada: null,
                        esPromo: false
                    });
                }

                await aplicarPromociones();
                dibujarCarrito();
                txtClave.value = '';
            } catch (e) {
                showToast("Error al agregar producto", "error");
            } finally { procesando = false; txtClave.focus(); }
        }

        async function agregarProducto() {
            if (procesando) return;
            const codigo = txtClave.value.trim();
            if (!codigo) return;
            procesando = true;

            try {
                const response = await fetch('/api/venta/producto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo, idVentaActual: currentVentaId, userId: parseInt(currentUserId), idSucursal: parseInt(localStorage.getItem('idSucursal') || '1') })
                });
                const result = await response.json();

                if (result.success) {
                    const p = result.data;
                    currentVentaId = p.idVenta;
                    document.getElementById('lblVentaId').textContent = `Venta ID: ${currentVentaId}`;

                    const item = listaCarrito.find(x => x.idProducto === p.idProducto);
                    if (item) {
                        item.cantidad++;
                    } else {
                        listaCarrito.unshift({
                            carritoId: ++carritoIdCounter,
                            idProducto: p.idProducto,
                            codigo: codigo,
                            nombre: p.nombre,
                            precioOriginal: p.precio,
                            precio: p.precio,
                            cantidad: 1,
                            stockActual: p.stock,
                            fotoProducto: p.fotoProducto || null,
                            promocionAplicada: null,
                            esPromo: false
                        });
                    }

                    await aplicarPromociones();
                    dibujarCarrito();
                    txtClave.value = '';
                } else {
                    const searchResponse = await fetch('/api/venta/buscar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ busqueda: codigo, idSucursal: parseInt(localStorage.getItem('idSucursal') || '1') })
                    });
                    const searchResult = await searchResponse.json();

                    if (searchResult.success && searchResult.tipo === 'sugerencias') {
                        mostrarSugerencias(searchResult.sugerencias);
                    } else {
                        showToast(result.message, "warning");
                    }
                }
            } finally { procesando = false; txtClave.focus(); }
        }

async function aplicarPromociones() {
             const nuevosItems = [];

             try {
                 const responsePromos = await fetch(`/api/promociones/activas/todas?sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`);
                 const todasLasPromos = await responsePromos.json();

                 let carritoCopia = listaCarrito.map(item => ({
                     ...item,
                     cantidadDisponible: item.cantidad
                 }));

                 const promosSimples = todasLasPromos.filter(p => (p.productos || []).length === 1);
                 const promosMixtas = todasLasPromos.filter(p => (p.productos || []).length > 1);

                 for (const promo of promosSimples) {
                     if (promo.tipo !== 'buy_x_get_y' || !promo.precio_especial) continue;

                     const idProductoPromo = (promo.productos || [])[0];
                     const itemsMismoProducto = carritoCopia.filter(item => item.idProducto === idProductoPromo);

                     if (itemsMismoProducto.length === 0) continue;

                     let totalDisponible = 0;
                     itemsMismoProducto.forEach(item => { totalDisponible += item.cantidadDisponible; });

                     const cantidadRequerida = Math.floor(promo.cantidad_requerida);
                     const precioPromo = promo.precio_especial / cantidadRequerida;
                     const gruposPromo = Math.floor(totalDisponible / cantidadRequerida);

                     if (gruposPromo > 0) {
                         for (let i = 0; i < gruposPromo; i++) {
                             nuevosItems.push({
                                 carritoId: ++carritoIdCounter,
                                 idProducto: idProductoPromo,
                                 codigo: itemsMismoProducto[0].codigo,
                                 nombre: itemsMismoProducto[0].nombre,
                                 precioOriginal: itemsMismoProducto[0].precioOriginal,
                                 precio: precioPromo,
                                 cantidad: cantidadRequerida,
                                 stockActual: itemsMismoProducto[0].stockActual,
                                 fotoProducto: itemsMismoProducto[0].fotoProducto,
                                 promocionAplicada: promo.nombre,
                                 esPromo: true
                             });
                         }

                         let restantePorRestar = gruposPromo * cantidadRequerida;
                         for (const item of itemsMismoProducto) {
                             if (restantePorRestar <= 0) break;
                             const aRestar = Math.min(restantePorRestar, item.cantidadDisponible);
                             item.cantidadDisponible -= aRestar;
                             restantePorRestar -= aRestar;
                         }
                     }
                 }

                 for (const promo of promosMixtas) {
                     if (promo.tipo !== 'buy_x_get_y' || !promo.precio_especial) continue;

                     const productosRequeridos = promo.productos || [];
                     const cantidadRequerida = Math.floor(promo.cantidad_requerida);
                     const cantidadPorProducto = Math.floor(cantidadRequerida / productosRequeridos.length);
                     const precioUnitarioPromo = promo.precio_especial / cantidadRequerida;

                     let gruposPosibles = Infinity;
                     for (const idProd of productosRequeridos) {
                         const item = carritoCopia.find(i => i.idProducto === idProd && i.cantidadDisponible >= cantidadPorProducto);
                         if (!item) { gruposPosibles = 0; break; }
                         gruposPosibles = Math.min(gruposPosibles, Math.floor(item.cantidadDisponible / cantidadPorProducto));
                     }

                     if (gruposPosibles > 0) {
                         for (let i = 0; i < gruposPosibles; i++) {
                             for (const idProd of productosRequeridos) {
                                 const item = carritoCopia.find(it => it.idProducto === idProd);
                                 if (item) {
                                     nuevosItems.push({
                                         carritoId: ++carritoIdCounter,
                                         idProducto: item.idProducto,
                                         codigo: item.codigo,
                                         nombre: item.nombre,
                                         precioOriginal: item.precioOriginal,
                                         precio: precioUnitarioPromo,
                                         cantidad: cantidadPorProducto,
                                         stockActual: item.stockActual,
                                         fotoProducto: item.fotoProducto,
                                         promocionAplicada: promo.nombre,
                                         esPromo: true
                                     });
                                     const idx = carritoCopia.indexOf(item);
                                     carritoCopia[idx].cantidadDisponible -= cantidadPorProducto;
                                 }
                             }
                         }
                     }
                 }

                 carritoCopia.forEach(item => {
                     if (item.cantidadDisponible > 0) {
                         nuevosItems.push({
                             carritoId: ++carritoIdCounter,
                             idProducto: item.idProducto,
                             codigo: item.codigo,
                             nombre: item.nombre,
                             precioOriginal: item.precioOriginal,
                             precio: item.precioOriginal,
                             cantidad: item.cantidadDisponible,
                             stockActual: item.stockActual,
                             fotoProducto: item.fotoProducto,
                             promocionAplicada: null,
                             esPromo: false
                         });
                     }
                 });

             } catch (error) {
                 listaCarrito.forEach(item => {
                     nuevosItems.push({
                         carritoId: ++carritoIdCounter,
                         idProducto: item.idProducto,
                         codigo: item.codigo,
                         nombre: item.nombre,
                         precioOriginal: item.precioOriginal,
                         precio: item.precioOriginal,
                         cantidad: item.cantidad,
                         stockActual: item.stockActual,
                         fotoProducto: item.fotoProducto,
                         promocionAplicada: null,
                         esPromo: false
                     });
                 });
             }

             listaCarrito = nuevosItems;
         }

        function dibujarCarrito() {
            cuerpoTabla.innerHTML = "";
            let sumaTotal = 0;
            listaCarrito.forEach((prod, index) => {
                const subtotal = prod.precio * prod.cantidad;
                sumaTotal += subtotal;

                let fotoHtml;
                if (prod.fotoProducto) {
                    fotoHtml = `<img src="data:image/jpeg;base64,${prod.fotoProducto}" class="product-foto" alt="Foto">`;
                } else {
                    fotoHtml = `<div class="no-foto">📦</div>`;
                }

                const promocionHtml = prod.promocionAplicada ? `<span class="promocion-badge">${prod.promocionAplicada}</span>` : '';

                const stock = prod.stockActual;
                const stockColor = stock != null && stock <= 5 ? '#dc3545' : '#333';
                const stockText = stock != null ? stock : '—';
                cuerpoTabla.innerHTML += `
                    <tr>
                        <td>${fotoHtml}</td>
                        <td style="color:#6b7280;font-size:12px">${prod.codigo}</td>
                        <td style="font-weight:600">${prod.nombre}</td>
                        <td style="font-weight: bold; color: ${stockColor};">${stockText}</td>
                        <td><span class="badge-cantidad" ondblclick="editarCantidad(${prod.carritoId})">${prod.cantidad}</span></td>
                        <td>$${prod.precio.toFixed(2)}</td>
                        <td>${promocionHtml}</td>
                        <td style="font-weight:700">$${subtotal.toFixed(2)}</td>
                        <td><button class="btn-eliminar-item" onclick="eliminarItem(${prod.carritoId})">✕ Quitar</button></td>
                    </tr>`;
            });
            totalVenta = sumaTotal;
            document.getElementById('lblTotal').textContent = `Total: $${sumaTotal.toFixed(2)}`;
        }

        function abrirModalPago() {
            if (listaCarrito.length === 0) { showToast("El carrito está vacío", "warning"); return; }

            document.getElementById('modalTotal').textContent = `$${totalVenta.toFixed(2)}`;
            document.getElementById('modalCambio').textContent = "$0.00";
            document.getElementById('txtPago').value = totalVenta.toFixed(2);
            document.getElementById('modalPago').classList.add('active');
            document.getElementById('txtPago').focus();
            document.getElementById('txtPago').select();
        }

        function cerrarModalPago() {
            document.getElementById('modalPago').classList.remove('active');
        }

        document.getElementById('txtPago').addEventListener('input', function() {
            let pago = parseFloat(this.value) || 0;
            pago = Math.round(pago * 100) / 100;
            if (parseFloat(this.value) !== pago) { this.value = pago.toFixed(2); }
            const cambio = Math.max(0, pago - totalVenta);
            document.getElementById('modalCambio').textContent = `$${cambio.toFixed(2)}`;
        });

        document.getElementById('txtPago').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') confirmarPago();
        });

        function confirmarPago() {
            const pago = parseFloat(document.getElementById('txtPago').value) || 0;
            const tolerancia = 0.01;
            if (pago < totalVenta - tolerancia) {
                showToast("El pago es insuficiente", "warning");
                return;
            }
            cerrarModalPago();
            finalizarVenta();
        }

        async function finalizarVenta() {
            if (listaCarrito.length === 0) { showToast("El carrito está vacío", "warning"); return; }

            const requestBody = {
                userId: parseInt(currentUserId),
                idVenta: currentVentaId,
                totalFinal: totalVenta,
                idSucursal: parseInt(localStorage.getItem('idSucursal') || '1'),
                listaCarrito: listaCarrito.map(p => ({ idProducto: p.idProducto, cantidad: p.cantidad, precioUnitario: p.precio }))
            };

            try {
                const res = await fetch('/api/venta/finalizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                const resData = await res.json();
                if (resData.success) {
                    showToast("Venta Cobrada Correctamente", "success");
                    limpiarPantallaVenta();
                } else showToast("Error: " + resData.message, "error");
            } catch (e) { showToast("Error de conexión", "error"); }
        }

        function limpiarPantallaVenta() {
            listaCarrito = [];
            carritoIdCounter = 0;
            currentVentaId = -1;
            cuerpoTabla.innerHTML = "";
            document.getElementById('lblTotal').textContent = "Total: $0.00";
            document.getElementById('lblVentaId').textContent = "Venta ID: -1";
            txtClave.value = "";
            txtClave.focus();
        }

        async function editarCantidad(carritoId) {
            const index = listaCarrito.findIndex(p => p.carritoId === carritoId);
            if (index === -1) return;
            const n = prompt("Nueva cantidad:", listaCarrito[index].cantidad);
            if (n && !isNaN(n) && n > 0) {
                listaCarrito[index].cantidad = parseFloat(n);
                await aplicarPromociones();
                dibujarCarrito();
            }
        }

        function eliminarItem(carritoId) {
             const index = listaCarrito.findIndex(p => p.carritoId === carritoId);
             if (index !== -1) {
                 listaCarrito.splice(index, 1);
                 aplicarPromociones().then(() => dibujarCarrito());
             }
         }

        function confirmarCancelacion() { if (confirm("¿Limpiar venta?")) limpiarPantallaVenta(); }
        document.getElementById('user-info').textContent = `Atiende: ${localStorage.getItem('nombreUsuario') || 'Cajero'}`;

        async function ponerEnEspera() {
            if (listaCarrito.length === 0) {
                showToast("El carrito está vacío. Agrega productos primero.", "warning");
                return;
            }

            const totalCarrito = listaCarrito.reduce((acc, p) => acc + (p.precio * p.cantidad), 0);

            if (!confirm(`¿Poner esta venta en espera por ${totalCarrito.toFixed(2)}?`)) {
                return;
            }

            try {
                const response = await fetch('/api/venta/guardar-espera', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: parseInt(currentUserId),
                        total: totalCarrito,
                        idSucursal: parseInt(localStorage.getItem('idSucursal') || '1'),
                        listaCarrito: listaCarrito.map(p => ({
                            idProducto: p.idProducto,
                            codigo: p.codigo,
                            nombre: p.nombre,
                            precio: p.precio,
                            cantidad: p.cantidad,
                            fotoProducto: p.fotoProducto
                        }))
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showToast("Venta guardada en espera correctamente", "success");
                    listaCarrito = [];
                    carritoIdCounter = 0;
                    currentVentaId = -1;
                    dibujarCarrito();
                    document.getElementById('lblTotal').textContent = "Total: $0.00";
                    document.getElementById('lblVentaId').textContent = "Venta ID: -1";
                } else {
                    showToast("Error al guardar: " + (result.message || "Error desconocido"), "error");
                }
            } catch (e) {
                showToast("Error de conexión al guardar la venta en espera", "error");
            }
        }

        async function abrirVentasEnEspera() {
            try {
                const response = await fetch(`/api/venta/lista-espera?sucursal=${parseInt(localStorage.getItem('idSucursal') || '1')}`);
                const result = await response.json();

                const container = document.getElementById('listaVentasEspera');

                if (result.success && result.ventas && result.ventas.length > 0) {
                    container.innerHTML = '';

                    result.ventas.forEach(venta => {
                        const div = document.createElement('div');
                        div.className = 'venta-espera-item';

                        const fecha = new Date(venta.fecha);
                        const fechaFormateada = fecha.toLocaleString('es-MX', {
                            day: '2-digit', month: '2-digit', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });

                        const nombresProductos = venta.detalles.map(d => `${d.nombre} (x${d.cantidad})`).join(', ');

                        div.innerHTML = `
                            <div class="venta-espera-header">
                                <span class="venta-espera-user">👤 ${venta.nombreUsuario || 'Usuario #' + venta.idUsuario}</span>
                                <span class="venta-espera-fecha">${fechaFormateada}</span>
                            </div>
                            <div class="venta-espera-productos">📦 ${nombresProductos}</div>
                            <div class="venta-espera-total">$${venta.total.toFixed(2)}</div>
                        `;

                        div.onclick = () => recuperarVentaEnEspera(venta.id);
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No hay ventas en espera</p>';
                }

                document.getElementById('modalVentasEspera').classList.add('active');

            } catch (e) {
                showToast("Error al cargar las ventas en espera", "error");
            }
        }

        function cerrarModalVentasEspera() {
            document.getElementById('modalVentasEspera').classList.remove('active');
            txtClave.focus();
        }

        async function recuperarVentaEnEspera(idVenta) {
            try {
                const response = await fetch(`/api/venta/obtener-espera/${idVenta}`);
                const result = await response.json();

                if (result.success && result.venta) {
                    const venta = result.venta;

                    if (!confirm(`¿Recuperar esta venta por $${venta.total.toFixed(2)}?`)) {
                        return;
                    }

                     listaCarrito = venta.detalles.map(d => ({
                         carritoId: ++carritoIdCounter,
                         idProducto: d.idProducto,
                         codigo: d.codigo,
                         nombre: d.nombre,
                         precioOriginal: d.precio,
                         precio: d.precio,
                         cantidad: Number(d.cantidad),
                         fotoProducto: d.fotoProducto,
                         promocionAplicada: null,
                         esPromo: false
                     }));

                    currentVentaId = -1;
                    dibujarCarrito();
                    cerrarModalVentasEspera();

                    await fetch(`/api/venta/eliminar-espera/${idVenta}`, { method: 'DELETE' });
                    showToast("Venta recuperada del espera", "success");
                } else {
                    showToast("Error al recuperar la venta: " + (result.message || "Error desconocido"), "error");
                }
            } catch (e) {
                showToast("Error de conexión al recuperar la venta", "error");
            }
        }
    </script>
</body>
